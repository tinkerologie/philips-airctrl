name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    timeout-minutes: 30
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Check formatting
        run: uv run --frozen --no-sync ruff format --check .

      - name: Lint
        run: uv run --frozen --no-sync ruff check --output-format=github .

      - name: Type check
        run: uv run --frozen --no-sync mypy

  test:
    timeout-minutes: 30
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every supported release, from the requires-python floor to the latest.
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --extra dev
      # Deprecations fail the run, so removals in newer Pythons surface early.
      - name: Run tests
        run: uv run --frozen --no-sync python -W error::DeprecationWarning -W error::PendingDeprecationWarning -m pytest

  ci-gate:
    name: CI Gate
    if: ${{ always() }}
    needs: ["lint", "test"]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require successful validation
        env:
          RESULTS: ${{ toJSON(needs) }}
          ALLOWED_SKIPS: ${{ '[]' }}
        run: |
          python3 - <<'PYTHON'
          import json, os, sys
          results = json.loads(os.environ['RESULTS'])
          allowed_skips = set(json.loads(os.environ['ALLOWED_SKIPS']))
          failures = {name: job['result'] for name, job in results.items()
                      if job['result'] != 'success'
                      and not (job['result'] == 'skipped' and name in allowed_skips)}
          if not results or failures:
              print(f'::error::Required CI did not pass: {failures or "no results"}')
              sys.exit(1)
          print('All required CI jobs passed (only documented event skips allowed).')
          PYTHON
