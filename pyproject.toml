[project]
name = "philips-airctrl"
dynamic = ["version"]
description = "Enhanced Philips air purifier library with Home Assistant integration, device discovery, and setup wizard"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    {name = "betaboon"},
    {name = "Ruaan Deysel", email = "ruaan@domalab.com"},
]
maintainers = [
    {name = "Ruaan Deysel", email = "ruaan@domalab.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Home Automation",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
keywords = [
    "philips",
    "air purifier",
    "coap",
    "iot",
    "home automation",
    "home assistant",
    "device discovery",
    "setup wizard",
]
requires-python = ">=3.11"
dependencies = [
    "pycryptodomex>=3.20.0",
    "aiocoap>=0.4.11",
    "netifaces>=0.11.0",
    "tabulate>=0.9.0",
    "pyyaml>=6.0",
    "click>=8.0.0",
    # Home Assistant 2026.10 pins pydantic 2.13.5; pydantic ships Python 3.15
    # wheels from 2.14.0 (pydantic-core 2.50), so only 3.15+ needs the newer floor.
    "pydantic>=2.11.0; python_version < '3.15'",
    "pydantic>=2.14.0; python_version >= '3.15'",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pre-commit>=4.0.0",
    "bandit[toml]>=1.7.0",
    "types-netifaces>=0.11.0",
    "types-PyYAML>=6.0",
    "types-tabulate>=0.9.0",
]

[project.urls]
Homepage = "https://github.com/tinkerologie/philips-airctrl"
Repository = "https://github.com/tinkerologie/philips-airctrl"
Issues = "https://github.com/tinkerologie/philips-airctrl/issues"
Changelog = "https://github.com/tinkerologie/philips-airctrl/blob/main/CHANGELOG.md"

[project.scripts]
philips-airctrl = "philips_airctrl.__main__:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/philips_airctrl/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/philips_airctrl"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "TCH",   # flake8-type-checking
    "RUF",   # ruff-specific rules
    "S",     # flake8-bandit (security checks via ruff)
]
ignore = [
    "S101",  # assert used in tests is fine
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["philips_airctrl"]

[tool.bandit]
targets = ["src"]
exclude_dirs = ["tests"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
plugins = ["pydantic.mypy"]
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
strict_equality = true

[[tool.mypy.overrides]]
# aiocoap ships no type information (no py.typed marker or stubs).
module = ["aiocoap", "aiocoap.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=philips_airctrl",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
source_pkgs = ["philips_airctrl"]
omit = [
    "*/tests/*",
    "*/test_*",
]

[tool.coverage.report]
fail_under = 100
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@overload",
]
